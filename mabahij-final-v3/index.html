<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7c3f91"><title>مباهج الخد</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}iframe{border:0;width:100%;height:100dvh;display:block}</style></head><body><iframe id="mabahij" src="source-v13.html?v=13" title="مباهج الخد"></iframe><script>(()=>{const f=document.getElementById('mabahij');f.addEventListener('load',()=>{try{const d=f.contentDocument;if(!d)return;const st=d.createElement('style');st.textContent=`.brand img,.fbrand img{background:transparent!important;border-radius:0!important;box-shadow:none!important;object-fit:contain!important}.brand img{width:auto!important;height:54px!important;max-width:96px!important}.fbrand img{width:auto!important;height:64px!important;max-width:110px!important}.logo-card img{background:transparent!important;border-radius:0!important;box-shadow:none!important;object-fit:contain!important;mix-blend-mode:normal!important;max-width:84%!important;max-height:84%!important}.round,.menu{color:#6b337c!important}.round{background:linear-gradient(145deg,#fbf7fb,#f5edf6)!important;border:1px solid #eadfe8!important;box-shadow:0 7px 20px rgba(91,48,105,.07)!important}.round svg{display:block!important;margin:auto!important;width:19px!important;height:19px!important;stroke:#6b337c!important;fill:none!important;stroke-width:1.7!important}`;d.head.appendChild(st);d.querySelectorAll('img[alt="شعار مباهج الخد"]').forEach(img=>{img.src='../mabahij-demo/logo-transparent.png?v=13';img.style.background='transparent';img.style.borderRadius='0';img.style.boxShadow='none';});const search=d.getElementById('search');if(search){search.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.4"></circle><path d="m16 16 4.2 4.2"></path></svg>';search.setAttribute('aria-label','البحث');}const cart=d.getElementById('cartBtn');if(cart){cart.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 8.5h11l1 11h-13l1-11Z"></path><path d="M9 8.5V7a3 3 0 0 1 6 0v1.5"></path></svg>';cart.setAttribute('aria-label','سلة التسوق');}}catch(e){console.error(e)}});})();</script></body></html>
